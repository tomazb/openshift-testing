apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-validator-read
  namespace: openshift-ovn-kubernetes
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [daemonsets, deployments, replicasets]
    verbs: [get, list]
