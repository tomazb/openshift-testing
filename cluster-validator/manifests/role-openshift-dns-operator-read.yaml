apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-validator-read
  namespace: openshift-dns-operator
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, events]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list]
